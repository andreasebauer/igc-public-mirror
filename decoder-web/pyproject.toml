[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infinity-grid-web"
version = "0.1.0"
requires-python = ">=3.12"
description = "HTTP client adapter for the registered Infinity Grid Decoder"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["ig_web*"]

[tool.setuptools.package-data]
ig_web = ["ui/*"]
