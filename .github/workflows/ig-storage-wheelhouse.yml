name: IG storage offline wheelhouse provisioning
on:
  push:
    branches: [ig-storage-step2-sqlite3513-20260928]
    paths: [.github/workflows/ig-storage-wheelhouse.yml]
permissions:
  contents: read
jobs:
  fetch-pinned-wheels:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download exact dependency wheels, without installing or executing them
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload/wheels
          cat > payload/requirements-versions.txt <<'REQ'
          pytest==9.0.2
          cryptography==46.0.4
          jsonschema==4.26.0
          referencing==0.37.0
          attrs==26.1.0
          jsonschema-specifications==2025.9.1
          rpds-py==2026.5.1
          packaging==25.0
          pluggy==1.6.0
          iniconfig==2.3.0
          pygments==2.20.0
          cffi==2.0.0
          pycparser==3.0
          igraph==1.0.0
          texttable==1.7.0
          sympy==1.14.0
          mpmath==1.3.0
          networkx==3.6.1
          REQ
          python3 -m pip download --index-url https://pypi.org/simple --only-binary=:all: --python-version 3.13 --implementation cp --abi cp313 --abi abi3 --abi none --platform manylinux_2_28_x86_64 --platform manylinux2014_x86_64 --dest payload/wheels -r payload/requirements-versions.txt
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          p=pathlib.Path('payload'); rows=[]; locks=[]
          for f in sorted((p/'wheels').glob('*.whl')):
              name,version=f.name.split('-')[:2]
              with urllib.request.urlopen('https://pypi.org/pypi/'+name+'/'+version+'/json',timeout=30) as response:
                  meta=json.load(response)
              matches=[r for r in meta['urls'] if r['filename']==f.name]
              assert len(matches)==1
              raw=f.read_bytes(); sha=hashlib.sha256(raw).hexdigest()
              assert sha==matches[0]['digests']['sha256'] and len(raw)==matches[0]['size']
              rows.append({'name':f.name,'distribution':name,'version':version,'sha256':sha,'size_bytes':len(raw),'pypi_sha256':matches[0]['digests']['sha256'],'url':matches[0]['url']})
              locks.append(name+'=='+version+' --hash=sha256:'+sha)
          (p/'requirements-hashed.txt').write_text('\n'.join(locks)+'\n')
          (p/'WHEEL_PROVENANCE.json').write_text(json.dumps({'scope':'DEPENDENCY_PROVISIONING_ONLY','science_execution':'NONE','python_target':'CPython 3.13 / Linux x86_64','github_run_id':os.environ['GITHUB_RUN_ID'],'github_commit':os.environ['GITHUB_SHA'],'files':rows},indent=2)+'\n')
          print('Verified',len(rows),'wheels against PyPI metadata')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ig-storage-cp313-pinned-wheelhouse
          path: payload/
          if-no-files-found: error
          retention-days: 30
