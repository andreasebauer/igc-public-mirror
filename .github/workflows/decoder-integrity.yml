name: Decoder source integrity
on:
  pull_request:
    paths: ['decoder/**', 'decoder-import/**', '.github/workflows/decoder-integrity.yml']
  push:
    paths: ['decoder/**', 'decoder-import/**', '.github/workflows/decoder-integrity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python decoder-import/verify_source.py
