name: Deploy Reverse Microscope to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'microscope/**'
      - 'decoder-preview/**'
      - '.github/workflows/microscope-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble microscope and Decoder preview
        run: |
          mkdir -p _pages/decoder
          cp -a microscope/. _pages/
          cp -a decoder-preview/. _pages/decoder/
      - name: Upload combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
